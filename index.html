<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S CORE — Indústrias TH</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background-glow"></div>

  <header class="topbar">
    <div>
      <h1>J.A.R.V.I.S CORE</h1>
      <p>Biblioteca inteligente de estudos — Indústrias TH</p>
    </div>

    <div class="status">
      <span class="pulse"></span>
      Sistema Online
    </div>
  </header>

  <main id="app">
    <section id="dashboard" class="screen active">
      <div class="hero">
        <div>
          <h2>Central de Unidades Curriculares</h2>
          <p>
            Acesse conteúdos completos, exemplos práticos, resumos e atividades
            de cada UC.
          </p>
        </div>

        <div class="reactor">
          <div class="reactor-core"></div>
        </div>
      </div>

      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Pesquisar conteúdo no J.A.R.V.I.S..."
        />
      </div>

      <section class="cards" id="ucCards"></section>
    </section>

    <section id="contentScreen" class="screen">
      <button class="back-btn" onclick="voltarDashboard()">← Voltar ao Dashboard</button>

      <article class="content-panel">
        <div class="content-header">
          <div class="content-icon" id="contentIcon"></div>

          <div>
            <span id="contentCode"></span>
            <h2 id="contentTitle"></h2>
            <p id="contentSubtitle"></p>
          </div>
        </div>

        <div id="contentBody"></div>
      </article>
    </section>
  </main>

  <footer>
    <p>J.A.R.V.I.S CORE — Sistema de Estudos Inteligente</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
