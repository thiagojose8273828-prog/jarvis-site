<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>J.A.R.V.I.S CORE</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="container">

    <section class="login-card">

      <div class="core-animation">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        <div class="core-dot"></div>
      </div>

      <h1>J.A.R.V.I.S CORE</h1>
      <p class="subtitle">Indústrias TH — Sistema de Acesso</p>

      <div class="tabs">
        <button id="btnLogin" class="tab active" onclick="mostrarLogin()">Entrar</button>
        <button id="btnCadastro" class="tab" onclick="mostrarCadastro()">Criar acesso</button>
      </div>

      <div id="areaLogin" class="form-area">
        <h2>Acesso ao sistema</h2>

        <input type="text" id="loginUsuario" placeholder="Usuário" />
        <input type="password" id="loginSenha" placeholder="Senha" />

        <button class="main-btn" onclick="fazerLogin()">Entrar no J.A.R.V.I.S</button>

        <p class="small-text">
          Ainda não tem acesso?
          <span onclick="mostrarCadastro()">Criar agora</span>
        </p>
      </div>

      <div id="areaCadastro" class="form-area hidden">
        <h2>Criar novo acesso</h2>

        <input type="text" id="cadastroUsuario" placeholder="Criar usuário" />
        <input type="email" id="cadastroEmail" placeholder="E-mail" />
        <input type="password" id="cadastroSenha" placeholder="Criar senha" />
        <input type="password" id="confirmarSenha" placeholder="Confirmar senha" />

        <button class="main-btn" onclick="criarAcesso()">Criar acesso</button>

        <p class="small-text">
          Já tem uma conta?
          <span onclick="mostrarLogin()">Entrar</span>
        </p>
      </div>

      <p class="security-text">
        Sistema local de autenticação J.A.R.V.I.S
      </p>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
